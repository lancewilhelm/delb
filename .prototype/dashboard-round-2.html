<!doctype html>
<html lang="en" data-variant="D"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delb dashboard layout study · round 2</title><style>
:root { color-scheme: dark; }
html, body { margin: 0; font: 14px/1.5 var(--font-sans, 'Geist', system-ui, sans-serif); }
body > #app { background: transparent; }
button, select { font: inherit; }
button { cursor: pointer; }
.sample-root { --bg-color: var(--background, #1b1b1b); --text-color: var(--foreground, #dddddd); --main-color: var(--foreground, #dddddd); --sub-color: var(--border, #555555); --sub-alt-color: var(--secondary, #252525); color: var(--text-color); }
.sample-light { color-scheme: light; --text-color: #1b1b1b; --main-color: #1b1b1b; --sub-color: #999; --sub-alt-color: #e7e7e7; --bg-color: #f2f2f2; }
.sample-light .dashboard-study, .sample-light .sample-nav, .sample-light .sample-tools, .sample-light .sample-notice { background: #f2f2f2; }
.sample-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; gap: 20px; background: var(--sub-alt-color); border-radius: var(--radius, 8px); }
.sample-brand { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.sample-brand strong { font: 500 22px/1.2 system-ui, sans-serif; margin-right: 8px; }
.sample-brand svg { width: 15px; }
.sample-header-actions { display: flex; gap: 16px; }
.sample-nav { display: flex; flex-wrap: wrap; justify-content: center; border-bottom: 1px solid var(--sub-color); gap: 4px; padding: 4px 0; font-size: 12px; }
.sample-nav span { padding: 3px 8px; opacity: .7; }
.sample-nav .active { background: color-mix(in srgb, var(--sub-color) 20%, transparent); opacity: 1; }
.sample-tools { display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: 12px 8px 0; font-size: 10px; color: var(--text-color); }
.sample-tools select, .sample-tools button { border: 1px solid var(--sub-color); padding: 4px 6px; border-radius: 4px; color: var(--text-color); background: var(--bg-color); }
.sample-tools label { display: flex; align-items: center; gap: 6px; }
.sample-thumbnail { width: 100%; }
.sample-cover { aspect-ratio: 2/3; border-radius: 5px; padding: 20px 12px 12px; box-shadow: inset 3px 0 5px #0002; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.sample-cover-author { font: 8px/1.5 system-ui, sans-serif; text-transform: uppercase; letter-spacing: 1.3px; }
.sample-cover-title { font: 23px/1.1 Georgia, serif; margin-top: 18px; }
.sample-cover-mark { font: 90px/1 Georgia, serif; margin-top: auto; align-self: center; opacity: .4; }
.sample-book-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 7px; font-size: 12px; }
.sample-notice { font-size: 11px; text-align: center; color: var(--text-color); }
@media (max-width: 420px) { .sample-header-actions { gap: 10px; } .sample-nav { font-size: 11px; gap: 0; } .sample-nav span { padding: 4px 6px; } }

.dashboard-study {
  box-sizing: border-box;
  width: min(100%, 900px);
  margin: auto;
  padding: 48px 28px 110px;
  color: var(--text-color);
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.dashboard-study * {
  box-sizing: border-box;
}

.study-greeting h1 {
  margin: 0;
  font:
    300 42px/1.2 Georgia,
    'Times New Roman',
    serif;
  letter-spacing: -1px;
}

.study-greeting p {
  margin: 12px 0 0;
  font-size: 14px;
  opacity: 0.7;
}

.study-greeting p span {
  font-weight: 500;
}

.study-greeting.centered {
  text-align: center;
}

.dashboard-study h2 {
  margin: 0;
  font:
    600 16px/1.5 'Geist',
    system-ui,
    sans-serif;
}

.dashboard-study-B {
  width: min(100%, 1040px);
  gap: 40px;
}

.study-columns {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  gap: 40px;
  align-items: start;
}

.study-overview > h2 {
  margin-bottom: 18px;
}

.dashboard-study-C {
  width: min(100%, 1000px);
  gap: 36px;
}

.dashboard-study-D,
.dashboard-study-E,
.dashboard-study-F {
  width: min(100%, 1000px);
  gap: 32px;
}

.study-stats-rail.study-stats-top {
  border-top: 0;
  border-bottom: 1px solid var(--sub-color);
  padding-top: 0;
  padding-bottom: 28px;
}

.study-greeting.compact {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.study-greeting.compact h1 {
  font-size: 32px;
}

.study-greeting.compact p {
  margin: 0;
}

@media (max-width: 700px) {
  .dashboard-study {
    padding: 32px 20px 120px;
    gap: 28px;
  }

  .study-greeting h1 {
    font-size: 36px;
  }

  .study-columns {
    grid-template-columns: minmax(0, 1fr);
    gap: 28px;
  }

  .study-greeting.compact {
    display: block;
  }

  .study-greeting.compact p {
    margin-top: 10px;
  }
}


.study-switcher {
  box-sizing: border-box;
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  width: min(370px, calc(100% - 24px));
  padding: 10px 12px;
  border: 1px solid #555;
  border-radius: 12px;
  background: #252525;
  color: #eee;
  box-shadow: 0 8px 32px #0003;
  font:
    12px/1.4 'Geist',
    system-ui,
    sans-serif;
}

.study-switcher-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid #444;
}

.study-switcher-topline > span {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: #aaa;
}

.study-switcher-tabs,
.study-switcher-cycle {
  display: flex;
  align-items: center;
  gap: 4px;
}

.study-switcher button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: #bbb;
  border: 0;
  border-radius: 5px;
  padding: 4px 9px;
  cursor: pointer;
  font: inherit;
}

.study-switcher button:hover {
  background: #444;
  color: #fff;
}

.study-switcher button[aria-pressed='true'] {
  color: #1b1b1b;
  background: #eee;
}

.study-switcher button:focus-visible {
  outline: 2px solid #eee;
  outline-offset: 3px;
}

.study-switcher-cycle {
  justify-content: space-between;
  margin-top: 9px;
}

.study-switcher-cycle > button {
  font-size: 18px;
  min-width: 32px;
  min-height: 32px;
}

.study-switcher-cycle > div {
  text-align: center;
}

.study-switcher-cycle strong,
.study-switcher-cycle span {
  display: block;
}

.study-switcher-cycle strong {
  font-weight: 500;
}

.study-switcher-cycle span {
  margin-top: 2px;
  font-size: 10px;
  color: #aaa;
}


.study-choice-shelf {
  min-width: 0;
}
.study-shelf-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.study-shelf-tabs {
  display: flex;
  gap: 26px;
  min-width: 0;
}
.study-shelf-tabs button,
.study-shelf-segments button {
  font: inherit;
  color: var(--text-color);
  background: transparent;
  border: 0;
  cursor: pointer;
  border-radius: 0;
}
.study-shelf-tabs button {
  padding: 8px 0 12px;
  border-bottom: 2px solid transparent;
  font-size: 14px;
  opacity: 0.55;
  white-space: nowrap;
}
.study-shelf-tabs button[aria-pressed='true'] {
  border-color: var(--main-color);
  opacity: 1;
  font-weight: 500;
}
.study-shelf-tabs button:hover,
.study-shelf-segments button:hover {
  background: transparent;
  opacity: 1;
}
.study-shelf-view-all {
  color: inherit;
  opacity: 0.65;
  font-size: 12px;
  text-decoration: none;
  white-space: nowrap;
  margin-left: auto;
}
.study-shelf-view-all:hover {
  text-decoration: underline;
}
.study-shelf-subtitle {
  font-size: 12px;
  opacity: 0.6;
  margin: 12px 0 20px;
}
.study-shelf-dropdown select {
  appearance: auto;
  padding: 4px 4px 4px 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--text-color);
  font:
    500 18px/1.5 'Geist',
    system-ui,
    sans-serif;
  cursor: pointer;
}
.study-shelf-dropdown option {
  background: var(--bg-color);
  color: var(--text-color);
  font-size: 14px;
}
.study-shelf-segments {
  display: flex;
  padding: 3px;
  border-radius: 7px;
  background: color-mix(in srgb, var(--sub-color) 14%, transparent);
}
.study-shelf-segments button {
  padding: 7px 11px;
  font-size: 12px;
  border-radius: 5px;
  opacity: 0.6;
  white-space: nowrap;
}
.study-shelf-segments button[aria-pressed='true'] {
  background: var(--sub-alt-color);
  color: var(--main-color);
  opacity: 1;
  box-shadow: 0 1px 4px #0001;
}
.study-shelf-F .study-shelf-subtitle {
  margin-top: 18px;
}
.study-shelf-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.study-shelf-empty {
  padding: 32px 0;
  font-size: 13px;
  opacity: 0.65;
}
.study-shelf-sample-note {
  margin: 16px 0 0;
  font-size: 10px;
  opacity: 0.45;
}
.study-shelf-toolbar button:focus-visible,
.study-shelf-toolbar select:focus-visible,
.study-shelf-view-all:focus-visible {
  outline: 2px solid var(--main-color);
  outline-offset: 4px;
}
.study-sample-cover {
  position: relative;
  aspect-ratio: 2/3;
  border-radius: 5px;
  padding: 20px 12px 12px;
  box-shadow: inset 3px 0 5px #0002;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.study-sample-author {
  font:
    8px/1.5 system-ui,
    sans-serif;
  text-transform: uppercase;
  letter-spacing: 1.3px;
  padding-right: 8px;
}
.study-sample-title {
  font:
    23px/1.1 Georgia,
    serif;
  margin-top: 18px;
  overflow-wrap: anywhere;
}
.study-sample-circle {
  font:
    90px/1 Georgia,
    serif;
  margin-top: auto;
  align-self: center;
  opacity: 0.35;
}
.study-sample-favorite {
  position: absolute;
  top: 5px;
  right: 8px;
  font-size: 14px;
}
.study-sample-book-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 7px;
  font-size: 12px;
}
@media (max-width: 700px) {
  .study-shelf-tabs {
    gap: 18px;
  }
  .study-shelf-tabs button {
    font-size: 12px;
  }
  .study-shelf-D .study-shelf-toolbar {
    flex-wrap: wrap;
    gap: 0;
  }
  .study-shelf-F .study-shelf-toolbar {
    flex-wrap: wrap;
    gap: 12px;
  }
  .study-shelf-F .study-shelf-toolbar > h2 {
    width: 100%;
  }
  .study-shelf-segments {
    max-width: 100%;
  }
  .study-shelf-segments button {
    padding: 7px 9px;
    font-size: 11px;
  }
}


.study-stats {
  display: grid;
  gap: 12px;
}

.study-stat {
  color: inherit;
  text-decoration: none;
  border: 1px solid var(--sub-color);
  border-radius: 8px;
  padding: 17px 18px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 18px;
  gap: 6px 10px;
  transition: background 120ms;
}

.study-stat:hover {
  background: color-mix(in srgb, var(--sub-color) 12%, transparent);
}

.study-stat:focus-visible,
.study-reading a:focus-visible {
  outline: 2px solid var(--main-color);
  outline-offset: 4px;
}

.study-stat-icon {
  grid-column: 2;
  grid-row: 1;
  width: 16px;
  height: 16px;
  opacity: 0.5;
}

.study-stat-label {
  grid-column: 1;
  grid-row: 1;
  font-size: 12px;
  line-height: 18px;
  opacity: 0.7;
}

.study-stat-value {
  grid-column: 1 / -1;
  font-size: 28px;
  line-height: 32px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.study-stats-cards {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.study-stats-list {
  gap: 0;
}

.study-stats-list .study-stat {
  border: 0;
  border-bottom: 1px solid color-mix(in srgb, var(--sub-color) 55%, transparent);
  border-radius: 0;
  padding: 14px 0;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  align-items: center;
}

.study-stats-list .study-stat-icon {
  grid-column: 1;
}

.study-stats-list .study-stat-label {
  grid-column: 2;
  font-size: 13px;
}

.study-stats-list .study-stat-value {
  grid-column: 3;
  grid-row: 1;
  font-size: 18px;
  line-height: 24px;
}

.study-stats-rail {
  grid-template-columns: repeat(6, minmax(0, 1fr));
  border-top: 1px solid var(--sub-color);
  padding-top: 24px;
  gap: 0;
}

.study-stats-rail .study-stat {
  border: 0;
  border-right: 1px solid color-mix(in srgb, var(--sub-color) 55%, transparent);
  border-radius: 0;
  padding: 4px 16px;
  display: flex;
  flex-direction: column-reverse;
  align-items: flex-start;
  gap: 6px;
}

.study-stats-rail .study-stat:first-child {
  padding-left: 0;
}

.study-stats-rail .study-stat:last-child {
  border-right: 0;
}

.study-stats-rail .study-stat-icon {
  display: none;
}

@media (max-width: 700px) {
  .study-stats-rail {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    row-gap: 24px;
  }

  .study-stats-rail .study-stat:nth-child(4) {
    padding-left: 0;
  }

  .study-stats-rail .study-stat:nth-child(3) {
    border-right: 0;
  }
}

@media (max-width: 480px) {
  .study-stats-cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}


.study-reading {
  min-width: 0;
}

.study-reading-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.study-reading-heading a {
  color: inherit;
  font-size: 12px;
  text-decoration: none;
  opacity: 0.7;
}

.study-reading-heading a:hover {
  opacity: 1;
  text-decoration: underline;
}

.study-reading-shelf {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  padding-bottom: 10px;
}

.study-reading-book {
  width: 140px;
  min-width: 0;
  flex-shrink: 0;
}

.study-reading-progress,
.study-reading-empty {
  margin-top: 8px;
  font-size: 12px;
  line-height: 18px;
  opacity: 0.65;
}

@media (max-width: 700px) {
  .study-reading-book {
    width: 128px;
  }

  .study-reading-shelf {
    gap: 16px;
  }
}
