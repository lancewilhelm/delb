name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  verify:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide Docker image tags
        id: meta
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/delb
          TAGS="${IMAGE_NAME}:twilight"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:stable"
            TAGS="${TAGS},${IMAGE_NAME}:${GITHUB_REF##*/}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Get build commit
        id: get_version
        run: |
          echo "version=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NUXT_PUBLIC_APP_VERSION=${{ steps.get_version.outputs.version }}
