name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  release:
    types: [published]

concurrency:
  group: docker-image-${{ github.event_name == 'push' && 'edge' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide Docker image tags
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/delb"
          version=edge
          tags="$image:edge"
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version="$GITHUB_REF_NAME"
            if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ || ${#version} -gt 128 ]]; then
              echo "::error::Use a release tag such as v1.0.0 or v1.1.0-rc.1."
              exit 1
            fi
            tags="$image:$version"
            if [[ "$PRERELEASE" == false && "$version" != *-* ]]; then
              latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
              if [[ "$version" == "$latest" ]]; then
                tags="$tags,$image:stable"
              fi
            fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version+$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
