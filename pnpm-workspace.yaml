packages:
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  core-js: false
  es5-ext: false
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - node-forge@1.4.1

overrides:
  'epubjs>@xmldom/xmldom': '^0.8.15'
  'epub2>adm-zip': '^0.6.1'
  'esbuild@<0.28.1': '^0.28.1'
  'simple-git@<4.0.1': '^4.0.2'
  'zod@<4.6.6': '^4.6.7'
  'undici@<8.12.2': '^8.12.3'
  'node-forge@<1.4.1': '^1.4.1'
  'serialize-javascript@<7.1.3': '^7.1.3'
